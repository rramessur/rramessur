<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Matcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='matcher_style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>

<body>
    <div class="app-container">
        <nav class="main-nav"
            style="display: flex; gap: 20px; justify-content: center; padding: 20px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); margin-bottom: 20px; border-radius: 12px;">
            <a href="/" style="color: white; text-decoration: none; font-weight: 600;">Extractor</a>
            <a href="/generate-page" style="color: white; text-decoration: none; font-weight: 600;">Generator</a>
            <a href="/direct-fill-page" style="color: white; text-decoration: none; font-weight: 600;">Direct Fill</a>
            <a href="/patient-matcher" style="color: #a5b4fc; text-decoration: none; font-weight: 600;">Patient
                Matcher</a>
        </nav>
        <header>
            <h1>Patient Matcher <span class="accent">AI</span></h1>
            <p class="subtitle">Securely randomize and match clinical data.</p>
        </header>

        <main>
            <div class="upload-section">
                <!-- Patient Demographics Upload -->
                <div class="card upload-card" id="drop-zone-demographics">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="8.5" cy="7" r="4" />
                            <line x1="20" y1="8" x2="20" y2="14" />
                            <line x1="23" y1="11" x2="17" y2="11" />
                        </svg>
                    </div>
                    <h2>Demographics</h2>
                    <p>Drag & drop CSV or click to browse</p>
                    <input type="file" id="input-demographics" accept=".csv" hidden>
                    <button class="btn secondary" onclick="document.getElementById('input-demographics').click()">Select
                        File</button>
                    <div class="file-status" id="status-demographics"></div>
                </div>

                <!-- Clinical Details Upload -->
                <div class="card upload-card" id="drop-zone-clinical">
                    <div class="icon-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" />
                            <polyline points="14 2 14 8 20 8" />
                            <path d="M16 13H8" />
                            <path d="M16 17H8" />
                            <path d="M10 9H8" />
                        </svg>
                    </div>
                    <h2>Clinical Details</h2>
                    <p>Drag & drop CSV or click to browse</p>
                    <input type="file" id="input-clinical" accept=".csv" hidden>
                    <button class="btn secondary" onclick="document.getElementById('input-clinical').click()">Select
                        File</button>
                    <div class="file-status" id="status-clinical"></div>
                </div>
            </div>

            <div class="controls">
                <button id="btn-mock" class="btn text-btn">Use Mock Data</button>
                <button id="btn-match" class="btn primary" disabled>Generate Matches</button>
                <button id="btn-download" class="btn secondary" disabled>Download CSV</button>
            </div>

            <div id="results-area" class="results-grid hidden">
                <!-- Matches will be injected here -->
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='matcher_script.js') }}"></script>
</body>

</html>
